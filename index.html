<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Emsi Tweet İlk 50</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --fg:#161a2b; --muted:#5d6480; --line:#e2e5ef;
  --accent:#2f5bea; --gold:#b7860b; --bad:#c62f3d;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1220; --panel:#171b2e; --fg:#e8eaf4; --muted:#9aa1bd; --line:#262b44;
  --accent:#7c9bff; --gold:#e3b341; --bad:#ff7b86; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
/* Giriş */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
.brand{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);margin:0 0 4px}
.card h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 20px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-bottom:14px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{width:100%;font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px;background:var(--accent);color:#fff;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;margin:12px 0 0;min-height:1.5em}
/* Liste */
.wrap{max-width:760px;margin-inline:auto;padding:28px 16px 48px}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.wrap h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,32px);margin:0;letter-spacing:-.01em}
.logout{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:6px 12px;cursor:pointer}
.sub{color:var(--muted);margin:6px 0 20px;font-size:14px}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;max-width:100%}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.range{color:var(--muted);font-size:13px;margin:12px 0 16px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rank{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.4}
li.top .rank{color:var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.who{font-weight:600}
.when{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.txt{margin:2px 0 0;overflow-wrap:anywhere}
.score{text-align:right;min-width:64px}
.total{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.3}
.split{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:13px;margin-top:20px}
@media (max-width:480px){li{grid-template-columns:28px minmax(0,1fr)}.score{grid-column:2;text-align:left;display:flex;gap:10px;align-items:baseline}}
</style>
</head>
<body>

<main class="login" id="login">
  <form class="card" id="form" autocomplete="on">
    <p class="brand">Meeting Challenge</p>
    <h1>Yönetim Paneline Giriş</h1>
    <label for="u">Kullanıcı Adı</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Şifre</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" id="go" type="submit">Giriş Yap</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

<div class="wrap" id="app" hidden>
  <div class="top-bar">
    <h1>Emsi Tweet · En çok etkileşim alan 50</h1>
    <button class="logout" id="out" type="button">Çıkış</button>
  </div>
  <p class="sub">Etkileşim = tepki (emoji) + mesaj sayısı. Veri 30 Ekim 2026, 18:55'te admin panelinden alındı.</p>
  <div class="seg" role="group" aria-label="Dönem">
    <button data-p="gun" aria-pressed="false" type="button">Günlük</button>
    <button data-p="hafta" aria-pressed="false" type="button">Haftalık</button>
    <button data-p="ay" aria-pressed="true" type="button">Aylık</button>
  </div>
  <p class="range" id="range"></p>
  <ol id="list"></ol>
  <p class="note">Tarihi gün olarak görünenler (saat yok) panelde "x gün önce" diye gösterilen gönderilerdir.</p>
</div>

const RANGE={gun:"Son 24 saat (29–30 Ekim 2026)",hafta:"Son 7 gün (23–30 Ekim 2026)",ay:"Son 30 gün (30 Eylül – 30 Ekim 2026) · 7.368 gönderi tarandı"};
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let D=null;

async function unlock(user,pass){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user+'\u0000'+pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));
  return JSON.parse(new TextDecoder().decode(pt));
}

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  $('err').textContent='';
  if(!window.crypto||!crypto.subtle){ $('err').textContent='Bu tarayıcı ortamı girişi desteklemiyor. Sayfayı https:// ile başlayan bir adresten ya da dosyayı Chrome/Safari/Edge ile doğrudan açın.'; return; }
  $('go').disabled=true; $('go').textContent='Kontrol ediliyor…';
  try{
    D=await unlock($('u').value.trim().toLowerCase(),$('p').value.trim());
    $('p').value=''; $('login').hidden=true; $('app').hidden=false; show('ay');
  }catch(_){
    $('err').textContent='Kullanıcı adı veya şifre hatalı.';
  }finally{ $('go').disabled=false; $('go').textContent='Giriş Yap'; }
});

$('out').addEventListener('click',()=>{ D=null; $('list').replaceChildren(); $('app').hidden=true; $('login').hidden=false; $('u').focus(); });

function show(p){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===p));
  $('range').textContent=RANGE[p];
  $('list').replaceChildren(...D[p].map((r,i)=>{
    const [who,when,tot,rx,msg,txt]=r;
    const li=document.createElement('li'); if(i<3) li.className='top';
    li.innerHTML='<div class="rank"></div><div><div class="meta"><span class="who"></span><span class="when"></span></div><p class="txt"></p></div><div class="score"><div class="total"></div><div class="split"></div></div>';
    li.querySelector('.rank').textContent=i+1;
    li.querySelector('.who').textContent='@'+who;
    li.querySelector('.when').textContent=when;
    li.querySelector('.txt').textContent=txt;
    li.querySelector('.total').textContent=tot.toLocaleString('tr-TR');
    li.querySelector('.split').textContent=rx+' tepki · '+msg+' mesaj';
    return li;
  }));
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.p)));
